name: tagger

on:
  push:
    branches: [main]
    paths:
      - "services/tagger/**"
      - ".github/workflows/tagger.yml"
  pull_request:
    paths:
      - "services/tagger/**"
      - ".github/workflows/tagger.yml"

permissions:
  contents: read

concurrency:
  group: tagger-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/tagger

jobs:
  test:
    # GitHub-hosted standard runner only (see AGENTS.md, CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # A static FFmpeg with the MP3, Vorbis and Opus encoders the test media need (GPL build,
      # executed in CI only, never distributed). Pinned by digest; the Ubuntu package mirror
      # was too slow for the 100+ packages of the distribution FFmpeg.
      - name: FFmpeg (generates test media)
        timeout-minutes: 15
        env:
          IMAGE: docker.io/mwader/static-ffmpeg:9.0.2-1@sha256:f5d100184884eb3e82b0eb14bb5ebf98da99826ac824989720297fb9ef21c822
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          container=$(docker create "$IMAGE")
          docker cp "$container:/ffmpeg" "$RUNNER_TEMP/ffmpeg/ffmpeg"
          docker cp "$container:/ffprobe" "$RUNNER_TEMP/ffmpeg/ffprobe"
          docker rm "$container"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/ffmpeg" -hide_banner -version | head -1

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/tagger/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest
