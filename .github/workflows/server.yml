name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    # GitHub-hosted standard runner only (see AGENTS.md, CI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_USER: anthology
          POSTGRES_PASSWORD: anthology
          POSTGRES_DB: anthology-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthology -d anthology-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (SQLite)
        run: uv run pytest

      - name: Tests (PostgreSQL 18)
        env:
          ANTHOLOGY_TEST_DATABASE_URL: postgresql+asyncpg://anthology:anthology@localhost:5432/anthology-test
        run: uv run pytest
