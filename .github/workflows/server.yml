name: server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "services/tagger/**"
      - "tools/library-generator/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "services/tagger/**"
      - "tools/library-generator/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  test:
    # GitHub-hosted standard runner only (see AGENTS.md, CI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: docker.io/library/postgres:18
        env:
          POSTGRES_USER: anthology
          POSTGRES_PASSWORD: anthology
          POSTGRES_DB: anthology-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anthology -d anthology-test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Library generator (lint and tests)
        working-directory: tools/library-generator
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest

      - name: Install FFmpeg (fingerprint tests and test media for the tagger contract tests)
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Tests (SQLite)
        env:
          ANTHOLOGY_TEST_REQUIRE_FFMPEG: "1"
        run: uv run pytest

      - name: Tests (PostgreSQL 18)
        env:
          ANTHOLOGY_TEST_DATABASE_URL: postgresql+asyncpg://anthology:anthology@localhost:5432/anthology-test
          ANTHOLOGY_TEST_REQUIRE_FFMPEG: "1"
        run: uv run pytest

      - name: Start the tagger
        working-directory: services/tagger
        env:
          ANTHOLOGY_TAGGER_ROOTS: ${{ runner.temp }}/tagger
          ANTHOLOGY_TAGGER_CACHE_ROOT: ${{ runner.temp }}/tagger/cache
          ANTHOLOGY_TAGGER_JOURNAL_DIR: ${{ runner.temp }}/tagger/cache/journal
        run: |
          mkdir -p "$ANTHOLOGY_TAGGER_CACHE_ROOT"
          uv sync --frozen --no-dev
          nohup uv run --no-dev python -m tagger > "${{ runner.temp }}/tagger.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://127.0.0.1:8410/v1/health && exit 0
            sleep 1
          done
          cat "${{ runner.temp }}/tagger.log"
          exit 1

      - name: Tagger contract tests
        env:
          ANTHOLOGY_TEST_TAGGER_URL: http://127.0.0.1:8410
          ANTHOLOGY_TEST_TAGGER_ROOT: ${{ runner.temp }}/tagger
        run: uv run pytest -m tagger_contract
