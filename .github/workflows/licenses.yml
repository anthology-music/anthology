name: licenses

# Third-party licenses of the server and the client (change first-release, ADR 0004): the generated
# sections of THIRD_PARTY_LICENSES.md must match the lockfiles, and no dependency may have a
# copyleft or unknown license without a reviewed exception (tools/licenses/exceptions.toml).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "server/pyproject.toml"
      - "server/uv.lock"
      - "client/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/**/package.json"
      - "tools/licenses/**"
      - "tools/release/**"
      - "THIRD_PARTY_LICENSES.md"
      - ".github/workflows/licenses.yml"

permissions:
  contents: read

concurrency:
  group: licenses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    # GitHub-hosted standard runner only (see AGENTS.md, CI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          cd server && uv sync --frozen

      - name: Lint the license and release tools
        working-directory: server
        run: |
          uv run ruff check ../tools/licenses ../tools/release
          uv run ruff format --check ../tools/licenses ../tools/release

      - name: Check the third-party licenses
        working-directory: server
        run: uv run python ../tools/licenses/generate.py --check
