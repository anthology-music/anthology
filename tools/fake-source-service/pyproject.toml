[project]
name = "anthology-fake-source"
version = "0.1.0"
description = "A fake source service speaking the Anthology source service interface v1 (tests and development only)"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[project.scripts]
anthology-fake-source = "anthology_fake_source.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anthology_fake_source"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
