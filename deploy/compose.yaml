# Anthology – Compose file for `docker compose` or `podman compose`.
# Installation: docs/install.md. Podman users: the recommended setup is Quadlet (deploy/quadlet/).
#
# Before the first start, create the database password (kept out of the repository):
#   mkdir -p secrets && chmod 700 secrets && openssl rand -base64 32 > secrets/db_password
# The file itself stays readable (0644): the server and PostgreSQL read it as non-root users.
# It is bind-mounted with ":z" instead of a Compose secret, so that SELinux hosts (Fedora, RHEL)
# relabel it for the containers.

name: anthology

services:
  anthology-server:            # MIT
    image: ghcr.io/anthology-music/anthology-server:latest
    ports:
      - "8400:8400"
    environment:
      ANTHOLOGY_DATABASE_URL: postgresql+asyncpg://anthology@postgres:5432/anthology
      ANTHOLOGY_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      ANTHOLOGY_TAGGER_URL: http://anthology-tagger:8410
      ANTHOLOGY_SOURCE_SERVICES: ""                              # optional source services (ADR 0017), comma-separated URLs
      ANTHOLOGY_OMR_URL: http://audiveris:8430                   # optional
      ANTHOLOGY_MUSICBRAINZ_CONTACT: ""                          # your e-mail or URL for the MusicBrainz User-Agent
      ANTHOLOGY_ACOUSTID_API_KEY: ""                             # optional, enables fingerprint lookups
      ANTHOLOGY_MUSICBRAINZ_URL: ""                              # optional local mirror (docs/architecture/musicbrainz-mirror.md)
      ANTHOLOGY_IMPORT_ROOTS: /data/imports                      # folders admins may import from, comma-separated (docs/install.md)
      ANTHOLOGY_RAUMFELD_HOSTS: ""                               # Raumfeld host addresses if multicast does not reach the server (docs/install.md)
      ANTHOLOGY_OUTPUT_MEDIA_URL: ""                             # URL the speakers fetch music from, e.g. http://192.168.1.10:8400
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro,z
      - keys:/data/keys
      - library:/data/library
      - cache:/data/cache
      - imports:/data/imports
      - video:/data/video
    depends_on:
      postgres:
        condition: service_healthy
      anthology-tagger:
        condition: service_started
    restart: unless-stopped

  anthology-tagger:            # GPL-2.0-or-later (mutagen)
    image: ghcr.io/anthology-music/anthology-tagger:latest
    volumes:
      - library:/data/library
      - cache:/data/cache
      - imports:/data/imports
    restart: unless-stopped

  # Optional source services (streamrip, yt-dlp, spotDL) live in the
  # anthology-sources organisation; merge their deploy/compose.snippet.yaml here.

  audiveris:                   # AGPL-3.0 – optional
    image: ghcr.io/anthology-music/anthology-audiveris:latest
    profiles: ["omr"]
    volumes:
      - imports:/data/imports

  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: anthology
      POSTGRES_DB: anthology
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - ./secrets/db_password:/run/secrets/db_password:ro,z
      - db:/var/lib/postgresql          # PostgreSQL 18+: data below /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "anthology", "-d", "anthology"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  keys:
  library:
  cache:
  imports:
  video:
  db:

# Start with optional services:
#   docker compose -f deploy/compose.yaml --profile omr up -d
